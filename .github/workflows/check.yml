# Checks every PowerShell script parses (Windows PowerShell 5.1, what the toolkit runs on) on every push and pull
# request, and that the release zip's files are all there. Nothing is run and nothing is released from here.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script parses
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { $bad++; "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($bad) { throw "$bad parse error(s)" }
          "All scripts parse."
      - name: Version and release files
        shell: powershell
        run: |
          $v = [regex]::Match((Get-Content HallowCore.ps1 -Raw), "AppVersion = '([^']+)'").Groups[1].Value
          if (-not $v) { throw "No AppVersion in HallowCore.ps1" }
          foreach ($f in 'release\Install.ps1', 'release\INSTALL.bat', 'release\README.txt', 'HallowToolkit.ps1', 'hallow.ico') { if (-not (Test-Path $f)) { throw "Missing $f" } }
          "Hallow Toolkit $v - release files present."
